name: Build original practice audio
on:
  workflow_dispatch:
  push:
    paths:
      - 'practice-audio/cases.json'
      - 'practice-audio/generate.py'
      - '.github/workflows/practice-audio.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install offline speech synthesizer
        run: sudo apt-get update && sudo apt-get install -y espeak
      - name: Generate original training clips
        run: python3 practice-audio/generate.py
      - name: Commit audio assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add practice-audio/*.wav
          if ! git diff --cached --quiet; then
            git commit -m "Build original synthetic listening practice audio"
            git push
          fi
